<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <rect width="800" height="450" fill="#0B1120"/>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="lineG" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4"/>
      <stop offset="0.5" stop-color="#10B981"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#g1)"/>
  <!-- Top bar -->
  <rect x="30" y="25" width="740" height="40" rx="8" fill="#1E293B" opacity="0.6"/>
  <circle cx="55" cy="45" r="6" fill="#EF4444"/>
  <circle cx="75" cy="45" r="6" fill="#F59E0B"/>
  <circle cx="95" cy="45" r="6" fill="#10B981"/>
  <text x="125" y="50" font-family="'JetBrains Mono', monospace" font-size="13" fill="#94A3B8">vinharia-agnello-iot // fiware-orion // azure-vm-linux</text>

  <!-- Metric Cards -->
  <rect x="30" y="85" width="230" height="100" rx="12" fill="#0F172A" stroke="#1E293B"/>
  <text x="50" y="115" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#06B6D4">TEMPERATURA (DHT22)</text>
  <text x="50" y="155" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#FFFFFF">18.4 °C</text>
  <text x="160" y="155" font-family="Inter, sans-serif" font-size="12" fill="#10B981">● Ideal</text>

  <rect x="285" y="85" width="230" height="100" rx="12" fill="#0F172A" stroke="#1E293B"/>
  <text x="305" y="115" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#10B981">UMIDADE DO AR</text>
  <text x="305" y="155" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#FFFFFF">72.6 %</text>
  <text x="415" y="155" font-family="Inter, sans-serif" font-size="12" fill="#10B981">● Estável</text>

  <rect x="540" y="85" width="230" height="100" rx="12" fill="#0F172A" stroke="#1E293B"/>
  <text x="560" y="115" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#F59E0B">LUMINOSIDADE (LDR)</text>
  <text x="560" y="155" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#FFFFFF">310 Lux</text>
  <text x="670" y="155" font-family="Inter, sans-serif" font-size="12" fill="#F59E0B">● Monitorado</text>

  <!-- Chart Box -->
  <rect x="30" y="205" width="740" height="215" rx="12" fill="#0F172A" stroke="#1E293B"/>
  <text x="50" y="235" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">TELEMETRIA MQTT EM TEMPO REAL (ESP32 -> FIWARE STH-COMET)</text>
  
  <!-- Grid lines -->
  <line x1="50" y1="260" x2="750" y2="260" stroke="#1E293B" stroke-dasharray="4 4"/>
  <line x1="50" y1="310" x2="750" y2="310" stroke="#1E293B" stroke-dasharray="4 4"/>
  <line x1="50" y1="360" x2="750" y2="360" stroke="#1E293B" stroke-dasharray="4 4"/>

  <!-- Wave line chart -->
  <path d="M50 350 Q 120 270, 200 310 T 350 280 T 500 340 T 650 250 T 750 290" fill="none" stroke="url(#lineG)" stroke-width="4"/>
  <circle cx="650" cy="250" r="6" fill="#06B6D4"/>
  <circle cx="650" cy="250" r="12" stroke="#06B6D4" stroke-width="2" opacity="0.5"/>
</svg>
